<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette</title>
<style>body{margin:0;background:#f6f1e7;font-family:system-ui,sans-serif}.err{max-width:520px;margin:18vh auto;padding:0 24px;color:#17202e;line-height:1.5}.err a{color:#e2562b;font-weight:700}</style>
</head>
<body>
<script type="module">
import { buildMockup } from './js/app/mockup.js';
import { decodeModel } from './js/app/share.js';
const badge = `<a href="/" style="position:fixed;right:14px;bottom:14px;z-index:99;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:#060a13;color:#f1ece2;font:600 13px/1 system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 30px rgba(0,0,0,.35)"><i style="width:9px;height:9px;border-radius:50%;background:#ffb23e;box-shadow:0 0 10px 2px rgba(255,178,62,.6)"></i>Maquette faite avec PopSite</a>`;
try {
  const m = await decodeModel(location.hash.slice(1));
  if (!m.name) throw 0;
  const html = buildMockup(m).replace('</body>', badge + '</body>');
  document.open(); document.write(html); document.close();
} catch (e) {
  document.body.innerHTML = '<div class="err"><h1>Ce lien de maquette est incomplet.</h1><p>Il a peut-être été coupé en le copiant. Demande à la personne qui te l\'a envoyé de le renvoyer en entier.</p><p><a href="/">Découvrir PopSite</a></p></div>';
}
</script>
</body>
</html>
